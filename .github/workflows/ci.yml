name: CityDrivingTraining CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production single-file bundle
        run: npm run build
      - name: Core tests, architecture boundaries, docs & offline bundle gate
        run: node scripts/run-tests.mjs --check-dist
