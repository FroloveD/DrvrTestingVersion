name: Export Tilda site to offline archive

# Скачивает публичную страницу конструктора вместе со всеми CSS/JS/картинками
# и кладёт готовый офлайн-архив в артефакт запуска.
#
# Два способа запуска:
#   1) вручную из GitHub UI: Actions → «Export Tilda site…» → Run workflow (нужен файл в main);
#   2) из любой ветки push-ем изменённого `.site-export-request.json` (paths-триггер ниже).
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Адрес страницы (например https://dmitryusharov.tilda.ws/)"
        required: true
        default: "https://dmitryusharov.tilda.ws/"
      max_file_mb:
        description: "Лимит на один файл, МБ"
        required: false
        default: "20"
      max_total_mb:
        description: "Лимит на всю выгрузку, МБ"
        required: false
        default: "200"
  push:
    paths:
      - ".site-export-request.json"

permissions:
  contents: read

concurrency:
  group: site-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Download page, assets, CSS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Определить параметры запуска
        id: cfg
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URL="${{ inputs.url }}"
            MAX_FILE="${{ inputs.max_file_mb }}"
            MAX_TOTAL="${{ inputs.max_total_mb }}"
          else
            URL="$(node -p "require('./.site-export-request.json').url")"
            MAX_FILE="$(node -p "require('./.site-export-request.json').maxFileMb || 20")"
            MAX_TOTAL="$(node -p "require('./.site-export-request.json').maxTotalMb || 200")"
          fi
          [ -n "$URL" ] || { echo "Пустой url" >&2; exit 1; }
          HOST="$(node -p "new URL(process.argv[1]).hostname" "$URL")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "max_file=$MAX_FILE" >> "$GITHUB_OUTPUT"
          echo "max_total=$MAX_TOTAL" >> "$GITHUB_OUTPUT"
          echo "Страница: $URL ($HOST), лимиты: $MAX_FILE / $MAX_TOTAL МБ"

      - name: Скачать страницу и все ресурсы
        run: |
          set -euo pipefail
          OUT="artifacts/site-export"
          node tools/site-export.mjs "${{ steps.cfg.outputs.url }}" "$OUT" \
            --max-file-mb="${{ steps.cfg.outputs.max_file }}" \
            --max-total-mb="${{ steps.cfg.outputs.max_total }}"
          node -e '
            const m = require("./artifacts/site-export/meta.json");
            const lines = [
              "### Офлайн-выгрузка",
              "",
              "- **URL:** " + m.finalUrl,
              "- **Заголовок:** " + (m.title || "—"),
              "- **Файлов ресурсов:** " + m.downloadedFiles,
              "- **Размер ресурсов:** " + (m.downloadedBytes / 1048576).toFixed(2) + " МБ",
              "- **Инлайн-CSS блоков:** " + m.inlineCssBlocks,
              "- **Ошибок загрузки:** " + m.failures.length,
            ];
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      - name: Упаковать в ZIP
        run: |
          set -euo pipefail
          cd artifacts/site-export
          zip -qr ../site-export.zip .
          ls -lh ../site-export.zip

      - name: Артефакт workflow
        uses: actions/upload-artifact@v4
        with:
          name: site-export
          path: |
            artifacts/site-export
            artifacts/site-export.zip
          retention-days: 30
