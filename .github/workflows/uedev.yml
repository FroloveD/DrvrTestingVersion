name: UEDev portable core (not Unreal build)
on:
  push:
    paths: ['ue/**', 'tests/uedev-powertrain-parity.mjs', 'tests/uedev-camera-source.mjs', 'src/sim/vehicle.ts', 'src/sim/playerCar.ts', '.github/workflows/uedev.yml']
  pull_request:
    paths: ['ue/**', 'tests/uedev-powertrain-parity.mjs', 'tests/uedev-camera-source.mjs', 'src/sim/vehicle.ts', 'src/sim/playerCar.ts', '.github/workflows/uedev.yml']
permissions:
  contents: read
jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test portable C++ model (no Unreal SDK)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I ue/UEDev/Source/UEDev/Public \
            ue/UEDev/Tests/DrivingModelTest.cpp -o /tmp/uedev-model-test
          /tmp/uedev-model-test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compare C++ longitudinal functions with browser TS
        run: node tests/uedev-powertrain-parity.mjs
      - name: Camera adapter source guards (not Unreal runtime)
        run: node tests/uedev-camera-source.mjs
